<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arli Games | Official</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- شاشة الترحيب -->

    <section class="welcome-screen" id="welcomeScreen">

        <div class="welcome-box">

            <div class="welcome-line"></div>

            <h1 class="welcome-title">
                『 أهلاً بكم في موقع 』
            </h1>

            <h2 class="welcome-logo">
                ARLI GAMES
            </h2>

            <p class="welcome-text">
                🎮 عالم الألعاب يبدأ من هنا ⚡
            </p>

            <button
                class="enter-btn"
                onclick="enterWebsite()">

                ✦ الدخول للموقع ✦

            </button>

        </div>

    </section>


    <!-- الموقع الرئيسي -->

    <main class="main-site" id="mainSite">

        <!-- معلومات الموقع -->

        <div class="site-info">

            <div>
                <strong>صاحب الموقع:</strong>
                أريس
            </div>

            <div>
                <strong>مصمم الموقع:</strong>
                أحمد المصري
            </div>

        </div>


        <div class="container">

            <!-- PROFILE -->

            <div class="profile">

                <img
                    src="profile.png"
                    class="profile-img"
                    alt="Arli Games">

                <h1 class="name">
                    『 ARLI GAMES 』
                </h1>

                <p class="bio">
                    🎮 Roblox | Minecraft | And Other Games ⚡
                </p>

            </div>


            <!-- SOCIAL LINKS -->

            <div class="links">

                <!-- YouTube -->

                <a
                    href="https://youtube.com/@arli3320"
                    target="_blank"
                    class="link">

                    <img
                        src="youtube.png"
                        class="link-icon"
                        alt="YouTube">

                    <span>
                        YouTube
                    </span>

                </a>


                <!-- Discord -->

                <a
                    href="https://discord.gg/tmbV9aR7C"
                    target="_blank"
                    class="link">

                    <img
                        src="discord.png"
                        class="link-icon"
                        alt="Discord">

                    <span>
                        Discord
                    </span>

                </a>


                <!-- Instagram -->

                <a
                    href="https://www.instagram.com/arli.games"
                    target="_blank"
                    class="link">

                    <img
                        src="instagram.png"
                        class="link-icon"
                        alt="Instagram">

                    <span>
                        Instagram
                    </span>

                </a>


                <!-- TikTok -->

                <a
                    href="https://www.tiktok.com/@arli.games"
                    target="_blank"
                    class="link">

                    <img
                        src="tiktok.png"
                        class="link-icon"
                        alt="TikTok">

                    <span>
                        TikTok
                    </span>

                </a>

            </div>


            <!-- Footer -->

            <footer>
                © 2026 ARLI GAMES — All Rights Reserved
            </footer>

        </div>

    </main>


    <!-- JavaScript -->

    <script>

        function enterWebsite() {

            const welcome =
                document.getElementById("welcomeScreen");

            const main =
                document.getElementById("mainSite");

            welcome.classList.add("hide");

            setTimeout(function () {

                main.classList.add("show");

            }, 400);

        }

    </script>

</body>

</html>
